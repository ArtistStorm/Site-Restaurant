server {
listen 80;
root /usr/share/nginx/html;

location / {
# ESSENTIEL : fallback SPA
# /dashboard → Nginx ne trouve pas le fichier → sert index.html
try_files $uri $uri/ /index.html;
}

# Cache long pour les assets fingerprintés de Vite
location /assets/ {
expires 1y;
add_header Cache-Control "immutable";
}
}
